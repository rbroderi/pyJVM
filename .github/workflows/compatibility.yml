name: compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Smoke tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Differential conformance
        env:
          PYTHONPATH: .
        run: python -m pyjvm315.conformance tests/conformance --python python
