name: compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --ignore-requires-python -e . pytest
      - name: Smoke tests
        run: pytest -q
      - name: Differential conformance
        run: pyjvm315-conformance tests/conformance --python python
