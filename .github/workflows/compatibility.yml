name: compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conformance:
    name: conformance (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.15']   # 3.13 is the minimum supported version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Smoke tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Self-hosting bootstrap gate (stage 2 byte-identical to stage 1)
        env:
          PYTHONPATH: .
        run: |
          python tools/selfhost.py stage1 build/selfhost
          python tools/selfhost.py stage2 build/selfhost
      - name: Runtime method-size lint (HotSpot huge-method limit)
        env:
          PYTHONPATH: .
        run: python -m pyjvm315.methodsize --runtime
      - name: Differential conformance
        env:
          PYTHONPATH: .
        run: python -m pyjvm315.conformance tests/conformance --python python --target 21
      - name: Differential conformance, exec/eval/compile through the self-hosted compiler (no host Python)
        env:
          PYTHONPATH: .
        run: python -m pyjvm315.conformance tests/conformance --python python --target 21 --selfhosted


  cpython-regression-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: '5b28ebd109f08cfc44a3d6e573e087eaf86319b5' # CPython 3.15 corpus
          path: cpython-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: CPython 3.15 regression probe
        env:
          PYTHONPATH: .
        run: |
          python -m pyjvm315.regression_probe \
            --manifest tools/cpython_probe_manifest.txt \
            --cpython-root cpython-src \
            --output artifacts/cpython-regression-probe.json \
            --top 30 \
            --fail-on-error --min-compiles 325
      - name: Pinned 3,000-body CPython compilation corpus
        env:
          PYTHONPATH: .
        run: |
          python -m pyjvm315.regression_probe \
            --manifest tools/cpython_probe_3000_manifest.txt \
            --cpython-root cpython-src \
            --baseline tools/cpython_probe_3000_baseline.json \
            --output artifacts/cpython-regression-probe-3000.json \
            --expect-cases 3000 --min-compiles 2774 --fail-on-error --top 30
      - name: Upload regression probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-regression-probe
          path: artifacts/cpython-regression-probe*.json

  cpython-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: '5b28ebd109f08cfc44a3d6e573e087eaf86319b5' # CPython 3.15 corpus
          path: cpython-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute CPython regression bodies
        env:
          PYTHONPATH: .
        run: >-
          python -m pyjvm315.cpython_execution --cpython-root cpython-src
          --manifest tools/cpython_execution_manifest.txt --target 21 --selfhosted
          --output artifacts/cpython-execution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpython-execution
          path: artifacts/cpython-execution.json
